name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least privilege: CI only needs to read the repo.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [18, 20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - name: Typecheck + build
        run: npm run build
      - name: Lint
        run: npm run lint
      - name: Test (with coverage)
        run: npx vitest run --coverage
      - name: CLI smoke test (proves the published bin works)
        run: |
          node packages/cli/dist/bin.js version
          node packages/cli/dist/bin.js init --repo acme/widget --out /tmp/c.json
          node packages/cli/dist/bin.js compile /tmp/c.json --out /tmp/p.md
          test -s /tmp/p.md
          echo "hello" > /tmp/r.md
          W=$(node packages/cli/dist/bin.js witness stamp /tmp/r.md $(git rev-parse HEAD) | awk '/witness /{print $3}')
          node packages/cli/dist/bin.js witness verify /tmp/r.md $(git rev-parse HEAD) "$W"

  council-fails-closed:
    # The invariant that matters most in this fork: with NO model credentials
    # present, the merge gate must BLOCK, not merge. A degraded panel returns
    # confident-looking votes from whichever families did answer, so "it ran and
    # produced a verdict" is not evidence the verdict is safe. This job runs the
    # real CLI against a real PR shape with every key absent and asserts the
    # exit code is not 0.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci && npm run build
      - name: Assert no council credentials are present
        run: |
          test -z "${CLAUDE_CODE_OAUTH_TOKEN:-}${GEMINI_API_KEY:-}${XAI_API_KEY:-}" \
            && echo "confirmed: no council credentials in this job"
      - name: A credential-less council must never merge
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Exercise the real path. A non-existent PR would also exit non-zero —
          # from `gh pr view`, never reaching the panel — so an exit-code-only
          # assertion would keep passing even with the invariant broken. Find a
          # PR that actually exists, and if none does, FAIL rather than pass
          # having proven nothing.
          PR=$(gh pr list --repo "$GITHUB_REPOSITORY" --state all --limit 1 --json number --jq '.[0].number // empty')
          SRC="$GITHUB_REPOSITORY"
          if [ -z "$PR" ]; then
            SRC=ruvnet/dream-machine
            PR=$(gh pr list --repo "$SRC" --state all --limit 1 --json number --jq '.[0].number // empty')
          fi
          if [ -z "$PR" ]; then
            echo "::error::no pull request available to exercise the gate against — the fail-closed invariant was NOT verified"
            exit 1
          fi
          echo "exercising the gate against $SRC#$PR"

          set +e
          node packages/cli/dist/bin.js council review --pr "$PR" --repo "$SRC" --dry-run > out.md 2> err.txt
          CODE=$?
          set -e
          cat out.md; cat err.txt >&2 || true

          if [ "$CODE" -eq 0 ]; then
            echo "::error::the council returned MERGE with no credentials — the fail-closed invariant is broken"
            exit 1
          fi
          # Assert the REASON, not just the exit code: the panel must have been
          # convened and found degraded. Anything else (a gather failure, a crash)
          # means this job did not test what it claims to test.
          if ! grep -q 'Degraded panel' out.md; then
            echo "::error::the run did not reach a degraded-panel verdict, so the fail-closed path was never exercised."
            echo "::error::exit was $CODE, but for some other reason — see the output above."
            exit 1
          fi
          echo "confirmed: the panel convened, every family was unreachable, and the verdict was BLOCK"

  no-optional-deps:
    # ADR-150 invariant: the engine builds and tests with the optional
    # ruvector/RVF wasm backends ABSENT. They are declared peer-optional in
    # @dream-machine/memory, so a plain `npm ci` never installs them — this
    # default install IS the "no optional backend" scenario. (We deliberately
    # do NOT pass `npm ci --omit=optional`, which trips the known npm bug
    # npm/cli#4828 and removes rollup's platform binary that vitest needs.)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - name: Assert ruvector backends are NOT installed
        run: |
          test ! -d node_modules/@ruvector/wasm && test ! -d node_modules/@ruvector/rvf-wasm \
            && echo "confirmed: ruvector wasm backends absent (peer-optional)"
      - run: npm run build
      - name: Memory adapter degrades gracefully without ruvector
        run: npx vitest run packages/memory
